[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    ".deps",
    ".venv",
    ".venv-ci",
    "venv",
    "verification",
    "__pycache__",
]

[tool.ruff.lint]
# Keep CI focused on correctness rather than reformatting the existing codebase.
select = ["E9", "F63", "F7", "F82"]